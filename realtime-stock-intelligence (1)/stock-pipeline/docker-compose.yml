# Default:          docker compose up -d --build
# + news sentiment: docker compose --profile nlp up -d --build
# + Airflow:        docker compose --profile airflow up -d --build

x-app: &app
  build: .
  image: stock-pipeline-app
  env_file:
    - path: .env
      required: false
  environment:
    KAFKA_BOOTSTRAP: kafka:19092
    PG_DSN: dbname=stocks user=stocks password=stocks host=postgres port=5432
    PG_RO_DSN: dbname=stocks user=analyst_ro password=analyst_ro host=postgres port=5432
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./mlruns:/app/mlruns
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on: [kafka]

  postgres:
    image: pgvector/pgvector:pg16      # Postgres + pgvector (vector search for RAG)
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: stocks
      POSTGRES_PASSWORD: stocks
      POSTGRES_DB: stocks
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks"]
      interval: 5s
      retries: 20

  producer:
    <<: *app
    command: ["sh", "-c", "python producer/producer.py --mode $${PRODUCER_MODE:-simulate}"]

  spark-stream:
    <<: *app
    command: ["python", "streaming/spark_stream.py"]
    ports: ["4040:4040"]

  scorer:
    <<: *app
    command: ["python", "ml/scorer.py"]

  api:
    <<: *app
    ports: ["8000:8000"]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  rag-indexer:
    <<: *app
    command: ["python", "genai/rag.py"]

  news-producer:
    <<: *app
    profiles: ["nlp"]
    command: ["sh", "-c", "python nlp/news_producer.py --mode $${PRODUCER_MODE:-simulate}"]

  sentiment:
    <<: *app
    profiles: ["nlp"]
    build:
      context: .
      args: { INSTALL_NLP: "true" }
    image: stock-pipeline-nlp
    command: ["python", "nlp/sentiment.py"]

  airflow:
    profiles: ["airflow"]
    build: { context: ., dockerfile: Dockerfile.airflow }
    command: standalone          # admin password is printed in the logs
    ports: ["8081:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      PROJECT_DIR: /opt/project
      PYTHONPATH: /opt/project
      PG_DSN: dbname=stocks user=stocks password=stocks host=postgres port=5432
    volumes:
      - .:/opt/project
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
